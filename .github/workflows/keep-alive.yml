name: Keep Supabase Active

on:
  schedule:
    # Runs automatically every 3 days at midnight!
    - cron: '0 0 */3 * *'
  # This allows to manually trigger it anytime from Github
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database API
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"